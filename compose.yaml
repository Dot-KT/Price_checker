services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: price_checker
      POSTGRES_USER: price_checker
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - price_checker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_checker -d price_checker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  price_checker_data:
